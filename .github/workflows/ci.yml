name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      # The Azure object-storage driver authenticates with a managed identity and
      # plain data-plane access. That is only sufficient while nothing calls the
      # presigned-URL helpers — those would additionally require a user-delegation
      # SAS and the Storage Blob Delegator role. Fail loudly if a caller appears,
      # rather than discovering it when an upload 403s in production.
      - name: No live callers of the presigned-URL helpers
        run: |
          if grep -rn "signObjectURL\|getObjectEntityUploadURL" server/routes/ server/lib/; then
            echo "::error::A live caller of signObjectURL/getObjectEntityUploadURL was reintroduced."
            echo "The Azure driver would need a user-delegation SAS and the Storage Blob Delegator role."
            exit 1
          fi
          echo "OK: no live callers."

  migrations:
    name: Replay migrations on a fresh database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migrations_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_CHECK_DATABASE_URL: postgres://postgres:postgres@localhost:5432/migrations_check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Replay every shipped migration
        run: bash scripts/check-migrations.sh
