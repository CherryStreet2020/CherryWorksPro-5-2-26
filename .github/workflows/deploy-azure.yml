name: deploy-azure

# MANUAL DISPATCH ONLY. There is deliberately no `push` trigger.
#
# CWP's entrypoint runs `drizzle-kit push --force` on EVERY boot, and push
# converges by DROPPING. So every deploy is a schema-mutating event against the
# database holding real invoices, payments, payouts and the general ledger — a
# human chooses the moment. This is the csaa posture, not the cherrysite one
# (cherrysite runs no boot-time DDL, which is why merging deploys it).
#
# Reinforcing that: this repo is PUBLIC and `main` has no branch protection, so
# a push trigger would let any direct push roll production.
#
# NON-NEGOTIABLES:
#  * BUILD IN ACR (`az acr build`), never on the runner — no registry password
#    or layer cache on the runner.
#  * ROLL WITH `az containerapp update --image` ONLY. Never `az containerapp up`,
#    never `--yaml`. Those re-derive the whole template and silently drop what
#    was set out of band — here that is DATABASE_URL, both encryption keys, the
#    Stripe keys, the OAuth client secrets and the two volume mounts.
#    `--set-env-vars` appears EXACTLY ONCE, on the rollback path, audited below.
#  * ROLL BY IMMUTABLE DIGEST on the forward path.
#  * A LOAD-BEARING POST-ROLL GATE. `az containerapp update` returns 0 BEFORE
#    the revision activates, and in single-revision mode the OLD revision keeps
#    answering 200 — so a plain HTTP check false-greens a pull failure, a crash
#    loop, a dropped secret or an unreachable database.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm. Every deploy runs schema DDL against the production books.'
        required: true
        default: ''
      image_tag:
        description: 'Blank = build and deploy HEAD. A sha256:… digest (from a prior run summary, or the last-known-good tag) = byte-exact rollback, no rebuild.'
        required: false
        default: ''
      rehearsal:
        description: 'PRE-CUTOVER ONLY. Set to REHEARSAL to accept the cwp_rehearsal database instead of cwp. Never use this once the app serves cherryworkspro.com.'
        required: false
        default: ''

concurrency:
  # Constant group so two dispatches cannot race two updates and leave an older
  # image live. NEVER cancel-in-progress: killing a deploy mid-DDL is worse than
  # queueing behind it.
  #
  # TRAP: a run stuck in `queued` holds this group indefinitely. Diagnose with
  #   gh run list --workflow=deploy-azure.yml --json headSha,status,createdAt,updatedAt
  # If updatedAt == createdAt while queued, no runner ever claimed it and
  # cancelling that run is safe.
  group: cwp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # The federated credential only mints a usable token for
    # repo:…:ref:refs/heads/main. Without this guard, a dispatch from any
    # feature branch would authenticate through the `production` environment and
    # deploy that branch to production — the csaa gap.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    # JOB level only — a top-level block would narrow GITHUB_TOKEN for ci.yml.
    permissions:
      id-token: write
      contents: read

    steps:
      # The confirm check is a RUN STEP that exits 1, deliberately NOT a
      # job-level `if:`. A job-level condition with a wrong value produces a
      # SKIPPED job, which renders neutral-green — a deploy that looks
      # successful and shipped nothing. That is the csaa weakness.
      - name: Confirm intent
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::confirm was '${{ github.event.inputs.confirm }}', not the literal DEPLOY. Refusing."
            echo "Every deploy runs 'drizzle-kit push --force' against the production books."
            exit 1
          fi
          echo "confirmed"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Replaces the Replit package firewall, which CWP loses by leaving.
      # THE TREE MUST EXIST FIRST: with no node_modules, `npm audit` returns
      # "Invalid package tree" and exits non-zero, reading exactly like
      # "criticals found" and blocking every deploy for a reason that never
      # happened. Install, then audit, and keep the two failure modes distinct.
      # Both fail closed — a gate that cannot check must never read as a pass.
      - name: Dependency audit (criticals must be zero)
        run: |
          set -o pipefail
          npm ci --omit=dev --ignore-scripts
          set +e
          AUDIT_OUT="$(npm audit --omit=dev --audit-level=critical 2>&1)"
          AUDIT_RC=$?
          set -e
          echo "$AUDIT_OUT"
          if [ "$AUDIT_RC" -ne 0 ]; then
            if echo "$AUDIT_OUT" | grep -qiE "audit endpoint returned an error|Invalid package tree|ENETUNREACH|EAI_AGAIN"; then
              echo "::error::dependency audit COULD NOT RUN (npm/registry error, not a finding). Failing closed."
            else
              echo "::error::dependency audit FOUND critical vulnerabilities. Fix or pin them before deploying."
            fi
            exit 1
          fi
          echo "dependency audit: zero criticals"

      - name: Azure login (OIDC — no stored secret)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          # clientId is the identity's CLIENT id. The PRINCIPAL id is a
          # different value used only for role assignments; crossing them fails
          # in ways the error text does not explain.
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build in ACR, roll by digest, and verify the new revision
        env:
          RG: cwp-rg
          APP: cwp-app
          IMAGE_REPO: cwp
          ACR: ${{ vars.ACR_NAME }}
          LOGIN: ${{ vars.ACR_LOGIN_SERVER }}
          ACA_EXT_VERSION: ${{ vars.ACA_EXT_VERSION }}
          EXPECTED_FINGERPRINTS: ${{ vars.EXPECTED_KEY_FINGERPRINTS }}
          MAINT_TOKEN: ${{ secrets.INTERNAL_MAINTENANCE_TOKEN }}
          SHA: ${{ github.sha }}
          ROLLBACK: ${{ github.event.inputs.image_tag }}
          REHEARSAL: ${{ github.event.inputs.rehearsal }}
        run: bash scripts/azure/deploy_gate.sh
